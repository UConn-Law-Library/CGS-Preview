  (() => {
    const route = /^#\/t\/[^/?]+(?:\/c\/([^/?]+))?/.exec(location.hash);
    if (!route) return;
    const files = ["./data/supplements/manifest.json","./data/supplements/2026/manifest.json"];
    const chapter = route[1] && decodeURIComponent(route[1]);
    if (chapter && !["023m","203b","382e","392a","743kk","art-012","art-012a","819","932"].includes(chapter)) files.push("./data/chapters/" + chapter + ".json");
